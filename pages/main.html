<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Mind Over Mather</title>
</head>

<body class="game-page">
    <aside class="sidebar">
        <button class="btn-back" onclick="history.back()">←</button>
        <span class="stat-label">Points</span>
        <span class="stat-value js-points">0</span>
        <span class="stat-label">Streak</span>
        <span class="stat-value js-streak">0</span>
        <span class="stat-label">Current Multiplier</span>
        <span class="stat-value js-multiplier">x1.00</span>
    </aside>

    <main class="game-area">
         <div class="equation">
            <p class="js-number1">0</p>
            <p class="js-operator">+</p>
            <p class="js-number2">0</p>
            <div class="divider-line"></div>
        </div>
        <input class="js-answer" type="number" placeholder="?">
        <p class="js-result"></p>
    </main>

    <script src="/scripts/scripts.js">
    </script>
</body>

</html>
